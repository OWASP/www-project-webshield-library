name: owl-react-release

on:
  push:
    tags:
      - "react-v*.*.*"

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Publish React Adapter Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install
        run: npm ci

      - name: Validate tag matches package version
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#react-v}"
          PKG_VERSION="$(node -p "require('./src/adapters/react/package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag version react-v$TAG_VERSION does not match src/adapters/react/package.json version $PKG_VERSION"
            exit 1
          fi

      - name: Lint and test
        run: npm run check

      - name: Point the core dependency at the real published version
        shell: bash
        run: |
          # package.json uses "file:../../.." for reliable local monorepo installs
          # (npm workspaces don't consistently self-link the root package to a
          # member on a from-scratch install). Real consumers need a real semver
          # range instead, so rewrite it here, in the ephemeral CI checkout only —
          # nothing commits this change back to the repo.
          CORE_VERSION="$(node -p "require('./package.json').version")"
          node -e "
            const fs = require('fs');
            const path = 'src/adapters/react/package.json';
            const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));
            pkg.dependencies['@owasp-webshield/core'] = '^${CORE_VERSION}';
            fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + '\n');
          "
          cat src/adapters/react/package.json

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        working-directory: src/adapters/react
        run: npm publish --access public --provenance

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
