name: owl-node-release

on:
  push:
    tags:
      - "node-v*.*.*"

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Publish Node Server Layer Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          # No dependency cache when publishing: a cache written by a PR run could feed
          # tampered packages into the release build.
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      - name: Install
        run: npm ci

      - name: Validate tag matches package version
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#node-v}"
          PKG_VERSION="$(node -p "require('./src/adapters/node/package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag version node-v$TAG_VERSION does not match src/adapters/node/package.json version $PKG_VERSION"
            exit 1
          fi

      - name: Lint and test
        run: npm run check

      - name: Point the core dependency at the real published version
        shell: bash
        run: |
          # package.json uses "file:../../.." for reliable local monorepo installs
          # (npm workspaces don't consistently self-link the root package to a
          # member on a from-scratch install). Real consumers need a real semver
          # range instead, so rewrite it here, in the ephemeral CI checkout only —
          # nothing commits this change back to the repo.
          CORE_VERSION="$(node -p "require('./package.json').version")"
          node -e "
            const fs = require('fs');
            const path = 'src/adapters/node/package.json';
            const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));
            pkg.dependencies['@owasp-webshield/core'] = '^${CORE_VERSION}';
            fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + '\n');
          "
          cat src/adapters/node/package.json

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        working-directory: src/adapters/node
        run: npm publish --access public --provenance

      - name: Create GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
