name: owl-next-release

on:
  push:
    tags:
      - "next-v*.*.*"

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Publish Next.js Adapter Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          # No dependency cache when publishing: a cache written by a PR run could feed
          # tampered packages into the release build.
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      - name: Install
        run: npm ci

      - name: Validate tag matches package version
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#next-v}"
          PKG_VERSION="$(node -p "require('./src/adapters/next/package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag version next-v$TAG_VERSION does not match src/adapters/next/package.json version $PKG_VERSION"
            exit 1
          fi

      - name: Lint and test
        run: npm run check

      - name: Point the node and react dependencies at the real published versions
        shell: bash
        run: |
          # package.json uses "file:../node" and "file:../react" for reliable local
          # monorepo installs. Real consumers need real semver ranges instead, so
          # rewrite them here, in the ephemeral CI checkout only — nothing commits
          # this change back to the repo. Publish node-v<version> and
          # react-v<version> before tagging this package.
          for LAYER in node react; do
            VERSION="$(node -p "require('./src/adapters/${LAYER}/package.json').version")"
            if ! npm view "@owasp-webshield/${LAYER}@${VERSION}" version > /dev/null 2>&1; then
              echo "@owasp-webshield/${LAYER}@${VERSION} is not on npm yet; push tag ${LAYER}-v${VERSION} first."
              exit 1
            fi
            node -e "
              const fs = require('fs');
              const path = 'src/adapters/next/package.json';
              const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));
              pkg.dependencies['@owasp-webshield/${LAYER}'] = '^${VERSION}';
              fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + '\n');
            "
          done
          cat src/adapters/next/package.json

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        working-directory: src/adapters/next
        run: npm publish --access public --provenance

      - name: Create GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
